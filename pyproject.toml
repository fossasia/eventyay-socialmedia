[project]
name = "eventyay-socialmedia"
dynamic = ["version"]
description = "Social media automation plugin for eventyay"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["Eventyay"]
authors = [
    {name = "Saalim Aqueel", email = "aqueel192@gmail.com"},
]
maintainers = [
    {name = "Saalim Aqueel", email = "aqueel192@gmail.com"},
]

dependencies = [
    "Mastodon.py",
]

[project.entry-points."pretix.plugin"]
socialmedia = "socialmedia"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/fossasia/eventyay-socialmedia"
repository = "https://github.com/fossasia/eventyay-socialmedia"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
socialmedia = [
    "templates/socialmedia/*.html",
    "static/socialmedia/css/*.css",
    "static/socialmedia/js/*.js",
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.setuptools.dynamic]
version = {attr = "socialmedia.__version__"}

[tool.setuptools.packages.find]
include = ["socialmedia*"]
namespaces = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["socialmedia/migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["socialmedia"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "eventyay.config.settings"

[tool.coverage.run]
source = ["socialmedia"]
omit = [
    "*/migrations/*",
    "*/urls.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "def __repr__",
    "if settings.DEBUG",
    "NOQA",
    "NotImplementedError",
]

